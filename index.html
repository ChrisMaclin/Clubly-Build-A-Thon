<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubly</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="images/Clubly.jpg" alt="Clubly Logo" width="200" height="150">
    <p>Clubly is a project made by<strong> Team Cheeseburger</strong> which aims to provide a platform for users to connect with clubs.</p>
    <p style="font-weight:bold">Website is currently in development.</p>

    <label for="username">Username:</label>
    <input type="text" id="username" name="username" placeholder="Enter your username">
    <br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password">
    <br><br>
    <button type="submit">Login</button>
    <button type="submit">Sign Up</button>
    <br><br>

    
<style>
body {
    background: brown;
    color: white;
    font-family: Orbitron, sans-serif;
}

</style>
    
</body>
</html>
